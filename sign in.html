<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="sign-up.css">
    <link rel="stylesheet" href="../animations/animations.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <title>Sign Up — Shah's Writing</title>
</head>

<body>

    <div class="signin-container">

        <h2>Create Account</h2>

        <form class="signin-form" id="signupForm">

            <label>Username</label>
            <input type="text"     id="su_username" placeholder="Enter username"     required>

            <label>Mobile Number</label>
            <input type="text"     id="su_mobile"   placeholder="10-digit number"    pattern="[0-9]{10}" required>

            <label>Email</label>
            <input type="email"    id="su_email"    placeholder="Enter Gmail"        required>

            <label>Password</label>
            <input type="password" id="su_password" placeholder="Min 6 characters"  minlength="6" required>

            <label>Confirm Password</label>
            <input type="password" id="su_confirm"  placeholder="Re-enter password"  required>

            <div class="checkbox-container" style="margin:14px 0 4px;">
                <input type="checkbox" id="agreeCheck" required>
                <label for="agreeCheck">
                    I agree to <a href="terms.html" target="_blank">Terms &amp; Conditions</a>
                </label>
            </div>

            <button type="submit" class="btn-signin" id="signupBtn">Sign Up</button>

            <div class="or-divider"><span>OR</span></div>

            <!-- GOOGLE SIGN UP -->
            <div id="g_id_onload"
                data-client_id="770205631596-2399gdd58crd5sd8n6ambjks4bplarb3.apps.googleusercontent.com"
                data-auto_prompt="false"
                data-callback="handleGoogleLogin">
            </div>
            <div class="googleBtn">
                <div class="g_id_signin"
                    data-type="standard"
                    data-size="large"
                    data-theme="outline"
                    data-text="sign_up_with"
                    data-shape="rectangular">
                </div>
            </div>

            <div class="links">
                <a href="login.html">Already have an account? Login</a>
            </div>

        </form>

    </div>

    <script src="sign-up.js"></script>
    <script src="../animations/animations.js"></script>
</body>
</html>
